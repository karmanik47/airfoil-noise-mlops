services:
  api:
    build:
      context: .
    image: airfoil-noise-app:1.0.0
    command: ["serve-api"]
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
    image: airfoil-noise-app:1.0.0
    command:
      - streamlit
      - run
      - src/airfoil_noise/ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      AIRFOIL_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3